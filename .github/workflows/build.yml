name: Build and release

on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.2'
          cache: gradle
      - name: Build and verify
        run: bash ./gradlew --no-daemon build
      - name: Collect installable JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the Gradle mod version." >&2
            exit 1
          fi
          cp "build/libs/litematica-dimension-layers-$version+mc$minecraft.jar" dist/
          (cd dist && sha256sum ./*.jar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dimension-layers-distribution
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dimension-layers-distribution
          path: dist/
      - name: Publish verified build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Litematica Dimension Layers $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
